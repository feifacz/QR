<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="version" content="2.0.0-20261013">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR 工作室 — 极简二维码生成与美化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="dark"]{--bg:#09090b;--surface:#18181b;--surface2:#27272a;--border:#3f3f46;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--accent:#f97316;--accent2:#fb923c;--accent-glow:rgba(249,115,22,.12);--qr-card-bg:#fff;--err:#ef4444;--ok:#22c55e;--warn:#f59e0b;--radius:10px;--radius-lg:16px}
[data-theme="light"]{--bg:#f4f4f5;--surface:#fff;--surface2:#e4e4e7;--border:#d4d4d8;--text:#18181b;--text2:#52525b;--text3:#71717a;--accent:#ea580c;--accent2:#f97316;--accent-glow:rgba(234,88,12,.1);--qr-card-bg:#fff;--err:#dc2626;--ok:#16a34a;--warn:#d97706}
html{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;transition:background .3s,color .3s}
body{min-height:100dvh;display:flex;flex-direction:column}
input,select,textarea,button{font-family:inherit;font-size:inherit}
::selection{background:var(--accent);color:#fff}
.shell{max-width:760px;margin:0 auto;padding:24px 20px 60px;width:100%}
.hdr{text-align:center;padding:40px 0 28px;position:relative}
.hdr h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;letter-spacing:-.04em;margin-bottom:6px}
.hdr h1 span{color:var(--accent)}
.hdr p{color:var(--text2);font-size:.88rem}
.theme-toggle{position:absolute;top:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px;display:flex;gap:2px}
.theme-toggle button{width:32px;height:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;font-size:1rem;color:var(--text3);transition:all .2s;display:flex;align-items:center;justify-content:center}
.theme-toggle button.on{background:var(--accent);color:#fff}

.type-pills{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.pill{padding:9px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:.85rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;user-select:none}
.pill:hover{color:var(--text);border-color:var(--text3)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;transition:background .3s,border-color .3s}
.card-title{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:14px}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.inp::placeholder{color:var(--text3)}
.inp.invalid{border-color:var(--err)!important;box-shadow:0 0 0 3px rgba(239,68,68,.15)!important}
.inp.valid{border-color:var(--ok)!important}
textarea.inp{resize:vertical;min-height:75px}
select.inp{cursor:pointer;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2371717a' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
input[type=color].inp{height:42px;padding:4px 6px;cursor:pointer}
.val-msg{font-size:.72rem;margin-top:4px;min-height:1em}.val-msg.err{color:var(--err)}.val-msg.ok{color:var(--ok)}.val-msg.warn{color:var(--warn)}
.row{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}

.dp{display:none}.dp.on{display:block}

.presets{display:flex;gap:8px;margin-top:10px}
.preset{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;transition:transform .15s}
.preset:hover{transform:scale(1.15)}
.preset .fg{width:50%;height:100%;position:absolute;left:0;top:0}
.contrast-warn{font-size:.74rem;color:var(--warn);margin-top:8px;display:none;align-items:center;gap:4px}
.contrast-warn.show{display:flex}

.dz{border:2px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:border-color .2s;color:var(--text3);position:relative}
.dz:hover{border-color:var(--accent);color:var(--text2)}
.dz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.logo-strip{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.logo-strip img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.logo-strip .remove{margin-left:auto;color:var(--err);cursor:pointer;font-size:.75rem}

.preview-area{display:none;text-align:center;margin-top:10px}
.preview-area.on{display:block}
.qr-frame{display:inline-block;padding:16px;background:var(--qr-card-bg);border-radius:var(--radius-lg);box-shadow:0 8px 30px rgba(0,0,0,.15);margin-bottom:16px;max-width:100%}
.qr-frame canvas{display:block;max-width:100%;height:auto;border-radius:8px}

.link-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:none;align-items:center;gap:10px}
.link-box.on{display:flex}
.link-box .link-val{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.link-box .copy-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;color:var(--text);flex-shrink:0}
.link-box .copy-btn:hover{background:var(--surface2)}

.dl-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dl-btn{padding:10px 22px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.dl-btn:hover{background:var(--surface2);border-color:var(--text3)}
.dl-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dl-btn.primary:hover{opacity:.9}
.dl-icon{width:16px;height:16px}

.chk{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}

.footer{text-align:center;padding:30px 0;color:var(--text3);font-size:.78rem;border-top:1px solid var(--border);margin-top:auto}

/* Style preview thumbnails inside selects */
.style-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;margin-top:6px}
.style-option{border:1px solid var(--border);background:var(--bg);border-radius:var(--radius);padding:10px 8px;cursor:pointer;text-align:center;transition:all .2s;user-select:none}
.style-option:hover{border-color:var(--text3)}
.style-option.on{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);font-weight:600}
.style-option .opt-icon{font-size:1.4rem;display:block;margin-bottom:4px}
.style-option .opt-title{font-size:.78rem;display:block}

@media(max-width:600px){
  .shell{padding:16px 14px 48px}
  .hdr{padding:28px 0 20px}
  .r2,.r3{grid-template-columns:1fr}
  .style-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="shell">
  <div class="hdr">
    <div class="theme-toggle">
      <button onclick="setTheme('light')" id="theme-light">☀️</button>
      <button class="on" onclick="setTheme('dark')" id="theme-dark">🌙</button>
    </div>
    <h1>QR <span>工作室</span></h1>
    <p>极简经典二维码 · 支持个性化码点与角眼样式</p>
  </div>

  <!-- 类型选项卡 -->
  <div class="type-pills" id="type-pills">
    <div class="pill on" data-type="url">🌐 网址</div>
    <div class="pill" data-type="text">📝 文本</div>
    <div class="pill" data-type="phone">📞 电话</div>
    <div class="pill" data-type="sms">💬 短信</div>
  </div>

  <!-- 内容输入卡片 -->
  <div class="card">
    <div class="card-title">输入内容</div>
    
    <!-- 网址 -->
    <div class="dp on" id="dp-url">
      <div class="field">
        <label>网址链接 (URL)</label>
        <input class="inp" id="in-url" placeholder="https://example.com" value="https://example.com">
        <div class="val-msg" id="v-url"></div>
      </div>
    </div>

    <!-- 文本 -->
    <div class="dp" id="dp-text">
      <div class="field">
        <label>文本内容</label>
        <textarea class="inp" id="in-text" placeholder="输入任意文本、说明或留言…"></textarea>
      </div>
    </div>

    <!-- 电话 -->
    <div class="dp" id="dp-phone">
      <div class="field">
        <label>电话号码 <span style="font-size:.74rem;color:var(--text3);font-weight:normal">(扫码自动唤起手机拨号盘，无需输入区号)</span></label>
        <input class="inp" id="in-phone" placeholder="例如: 13800000000 或 021-12345678">
        <div class="val-msg" id="v-phone"></div>
      </div>
    </div>

    <!-- 短信 -->
    <div class="dp" id="dp-sms">
      <div class="field">
        <label>电话号码 <span style="font-size:.74rem;color:var(--text3);font-weight:normal">(扫码自动唤起手机发短信界面，无需输入区号)</span></label>
        <input class="inp" id="sms-phone" placeholder="例如: 13800000000">
        <div class="val-msg" id="v-sms-phone"></div>
      </div>
      <div class="field">
        <label>预填短信内容（可选）</label>
        <textarea class="inp" id="sms-msg" placeholder="例如: 您好，我想咨询一下具体业务…"></textarea>
      </div>
    </div>
  </div>

  <!-- 编码内容栏 -->
  <div class="link-box" id="std-link-box">
    <div class="link-val" id="std-link-val"></div>
    <button class="copy-btn" onclick="copyLink()">复制内容</button>
  </div>

  <!-- 二维码美化卡片 -->
  <div class="card">
    <div class="card-title">二维码美化</div>

    <!-- 码点样式选择器（截图图1、图2、图3） -->
    <div class="field">
      <label>码点样式 (Data Dots)</label>
      <div class="style-grid" id="dot-style-grid">
        <div class="style-option on" data-val="square">
          <span class="opt-icon">⬛</span>
          <span class="opt-title">经典方块</span>
        </div>
        <div class="style-option" data-val="capsule">
          <span class="opt-icon">💊</span>
          <span class="opt-title">胶囊条块 (图1)</span>
        </div>
        <div class="style-option" data-val="dots">
          <span class="opt-icon">⚫</span>
          <span class="opt-title">精致圆点 (图2)</span>
        </div>
        <div class="style-option" data-val="fluid">
          <span class="opt-icon">💧</span>
          <span class="opt-title">流体连通 (图3)</span>
        </div>
      </div>
    </div>

    <!-- 定位角眼样式选择器（截图图1、图2、图3） -->
    <div class="field" style="margin-top:16px">
      <label>定位角眼样式 (Corner Eyes)</label>
      <div class="style-grid" id="eye-style-grid">
        <div class="style-option on" data-val="square">
          <span class="opt-icon">🔲</span>
          <span class="opt-title">经典方眼</span>
        </div>
        <div class="style-option" data-val="rounded">
          <span class="opt-icon">🔘</span>
          <span class="opt-title">圆角方眼 (图1)</span>
        </div>
        <div class="style-option" data-val="diamond">
          <span class="opt-icon">⭕</span>
          <span class="opt-title">圆环菱心 (图2)</span>
        </div>
        <div class="style-option" data-val="circle-dot">
          <span class="opt-icon">🎯</span>
          <span class="opt-title">圆角实心 (图3)</span>
        </div>
      </div>
    </div>

    <hr class="sep">

    <!-- 颜色设置 -->
    <div class="row r2">
      <div class="field">
        <label>二维码颜色</label>
        <input type="color" class="inp" id="std-fg" value="#f97316">
      </div>
      <div class="field">
        <label>背景颜色</label>
        <input type="color" class="inp" id="std-bg" value="#ffffff">
      </div>
    </div>

    <!-- 配色预设 -->
    <div class="presets" id="color-presets">
      <div class="preset" title="灰橙" data-fg="#f97316" data-bg="#ffffff" style="background:#fff"><div class="fg" style="background:#f97316"></div></div>
      <div class="preset" title="黑白" data-fg="#000000" data-bg="#ffffff" style="background:#fff"><div class="fg" style="background:#000"></div></div>
      <div class="preset" title="深蓝" data-fg="#0284c7" data-bg="#ffffff" style="background:#fff"><div class="fg" style="background:#0284c7"></div></div>
      <div class="preset" title="深青" data-fg="#0d9488" data-bg="#ffffff" style="background:#fff"><div class="fg" style="background:#0d9488"></div></div>
      <div class="preset" title="暗夜" data-fg="#f4f4f5" data-bg="#18181b" style="background:#18181b"><div class="fg" style="background:#f4f4f5"></div></div>
      <div class="preset" title="紫罗兰" data-fg="#7c3aed" data-bg="#ffffff" style="background:#fff"><div class="fg" style="background:#7c3aed"></div></div>
    </div>
    <div class="contrast-warn" id="contrast-warn">⚠️ 对比度过低，手机可能难以识别</div>

    <hr class="sep">

    <!-- 高级与Logo -->
    <div class="row r3">
      <div class="field">
        <label>纠错等级</label>
        <select class="inp" id="std-ecc">
          <option value="L">低 (7%)</option>
          <option value="M">中 (15%)</option>
          <option value="Q">较高 (25%)</option>
          <option value="H" selected>高 (30% Logo推荐)</option>
        </select>
      </div>
      <div class="field">
        <label>导出分辨率</label>
        <select class="inp" id="std-res">
          <option value="512" selected>512px (标清)</option>
          <option value="1024">1024px (高清)</option>
          <option value="2048">2048px (印刷)</option>
        </select>
      </div>
      <div class="field">
        <label>中心 Logo</label>
        <div class="dz" id="std-logo-dz">
          <span id="std-logo-prompt">点击上传图标</span>
          <input type="file" id="std-logo-fi" accept="image/*">
        </div>
      </div>
    </div>
    <div id="std-logo-strip" class="logo-strip" style="display:none">
      <img id="std-logo-preview" alt="logo">
      <span style="font-size:.78rem;color:var(--text2)">已添加中心Logo</span>
      <span class="remove" onclick="clearStdLogo()">✕ 移除Logo</span>
    </div>

    <div class="row r2" style="margin-top:12px">
      <div class="field"><label class="chk"><input type="checkbox" id="std-outline"> 添加外边框</label></div>
      <div class="field"><label class="chk"><input type="checkbox" id="std-invert"> 反转颜色</label></div>
    </div>
  </div>

  <!-- 预览与下载区 -->
  <div class="preview-area on" id="std-preview-area">
    <div class="qr-frame" id="std-frame">
      <canvas id="std-canvas"></canvas>
    </div>
    <div class="dl-row">
      <button class="dl-btn primary" onclick="dlStdPNG()">
        <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载 PNG
      </button>
      <button class="dl-btn" onclick="shareStd()">
        <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享
      </button>
    </div>
  </div>
</div>

<div class="footer">
  QR 工作室 · 简洁高效二维码生成工具
</div>

<script>
// ═══════ 扫码拨号/发短信拦截与唤起 ═══════
(function(){
  try{
    const params = new URLSearchParams(window.location.search);
    const callNum = params.get('call');
    const smsNum = params.get('sms');
    const smsMsg = params.get('msg') || '';
    if(callNum){
      window.location.href = 'tel:' + callNum;
      window.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif;text-align:center;">' +
          '<div style="width:72px;height:72px;border-radius:50%;background:rgba(249,115,22,0.15);color:#f97316;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;">📞</div>' +
          '<h2 style="font-size:1.35rem;margin-bottom:8px;font-weight:600;">呼叫电话</h2>' +
          '<p style="color:#a1a1aa;font-size:1.1rem;margin-bottom:24px;font-family:monospace;letter-spacing:1px;">' + callNum + '</p>' +
          '<a href="tel:' + callNum + '" style="background:#f97316;color:#fff;text-decoration:none;padding:13px 36px;border-radius:28px;font-weight:600;font-size:1.05rem;box-shadow:0 4px 14px rgba(249,115,22,0.35);display:inline-block;">立即呼叫</a>' +
          '<p style="color:#71717a;font-size:0.8rem;margin-top:20px;">若未自动弹出拨号盘，请点击上方按钮</p>' +
        '</div>';
      });
    } else if(smsNum){
      const isApple = /(iPhone|iPad|iPod)/i.test(navigator.userAgent);
      const sep = isApple ? '&body=' : '?body=';
      const smsUri = 'sms:' + smsNum + (smsMsg ? sep + encodeURIComponent(smsMsg) : '');
      window.location.href = smsUri;
      window.addEventListener('DOMContentLoaded', () => {
        let msgPreview = smsMsg ? '<div style="max-width:320px;margin:0 auto 24px;background:#18181b;border:1px solid #3f3f46;border-radius:12px;padding:12px 16px;text-align:left;font-size:.9rem;color:#fafafa;line-height:1.5;"><div style="font-size:.72rem;color:#71717a;margin-bottom:4px;">短信预填内容：</div>' + smsMsg.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '';
        document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif;text-align:center;">' +
          '<div style="width:72px;height:72px;border-radius:50%;background:rgba(249,115,22,0.15);color:#f97316;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;">💬</div>' +
          '<h2 style="font-size:1.35rem;margin-bottom:8px;font-weight:600;">发送短信</h2>' +
          '<p style="color:#a1a1aa;font-size:1.1rem;margin-bottom:16px;font-family:monospace;letter-spacing:1px;">收件人：' + smsNum + '</p>' +
          msgPreview +
          '<a href="' + smsUri + '" style="background:#f97316;color:#fff;text-decoration:none;padding:13px 36px;border-radius:28px;font-weight:600;font-size:1.05rem;box-shadow:0 4px 14px rgba(249,115,22,0.35);display:inline-block;">立即发送短信</a>' +

      });

function checkContrast(){
  const fg=document.getElementById('std-fg').value, bg=document.getElementById('std-bg').value;
  const l1=lum(fg), l2=lum(bg), ratio=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
  document.getElementById('contrast-warn').classList.toggle('show',ratio<2.5);
}
function lum(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const a=[r,g,b].map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
  return a[0]*.2126+a[1]*.7152+a[2]*.0722;
}

// ═══════ 校验与数据获取 ═══════
function isUrl(s){try{new URL(s);return true}catch{return false}}
function isPhone(s){return/^\d{4,15}$/.test(s.replace(/[\s\-\(\)]/g,''))}
function vMsg(id,msg,type){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className='val-msg '+type}

function getStdData(){
  const curType=document.querySelector('.pill.on')?.dataset.type||'url';
  switch(curType){
    case 'url':{
      let v=document.getElementById('in-url').value.trim();
      if(v&&!/^https?:\/\//i.test(v)&&v.includes('.'))v='https://'+v;
      return v;
    }
    case 'text':
      return document.getElementById('in-text').value.trim();
    case 'phone':{
      const ph=document.getElementById('in-phone').value.trim().replace(/[\s\-\(\)]/g,'');
      return ph ? `${location.origin}${location.pathname}?call=${encodeURIComponent(ph)}` : '';
    }
    case 'sms':{
      const ph=document.getElementById('sms-phone').value.trim().replace(/[\s\-\(\)]/g,'');
      if(!ph)return'';
      const msg=document.getElementById('sms-msg').value.trim();
      let u=`${location.origin}${location.pathname}?sms=${encodeURIComponent(ph)}`;
      if(msg)u+=`&msg=${encodeURIComponent(msg)}`;
      return u;
    }
  }
  return '';
}

function validateAll(){
  const type=document.querySelector('.pill.on')?.dataset.type||'url';
  let valid=true;
  document.querySelectorAll('.val-msg').forEach(el=>{el.textContent='';el.className='val-msg'});
  document.querySelectorAll('.inp.invalid,.inp.valid').forEach(el=>el.classList.remove('invalid','valid'));
  switch(type){
    case 'url':{
      let v=document.getElementById('in-url').value.trim();
      if(!v){valid=false;break}
      if(!/^https?:\/\//i.test(v)&&v.includes('.'))v='https://'+v;
      if(!isUrl(v)){valid=false;vMsg('v-url','请输入有效网址','err');document.getElementById('in-url').classList.add('invalid')}
      else document.getElementById('in-url').classList.add('valid');
      break;
    }
    case 'text':
      if(!document.getElementById('in-text').value.trim())valid=false;
      break;
    case 'phone':{
      const ph=document.getElementById('in-phone').value.trim();
      if(!ph){valid=false;break}
      if(!isPhone(ph)){valid=false;vMsg('v-phone','需要4-15位数字','err');document.getElementById('in-phone').classList.add('invalid')}
      else document.getElementById('in-phone').classList.add('valid');
      break;
    }
    case 'sms':{
      const ph=document.getElementById('sms-phone').value.trim();
      if(!ph){valid=false;break}
      if(!isPhone(ph)){valid=false;vMsg('v-sms-phone','无效电话号码','err');document.getElementById('sms-phone').classList.add('invalid')}
      else document.getElementById('sms-phone').classList.add('valid');
      break;
    }
  }
  return valid;
}

// ═══════ 定位眼（Finder Pattern）判定 ═══════
function isFinderPattern(r, c, N) {
  // 3 个角上的 7x7 区域
  if (r < 7 && c < 7) return true; // 左上
  if (r < 7 && c >= N - 7) return true; // 右上
  if (r >= N - 7 && c < 7) return true; // 左下
  return false;
}

// ═══════ 核心绘制渲染器（支持截图样式） ═══════
function generateStandard(){
  const isValid=validateAll(), data=getStdData();
  updateLinkBox(data);
  if(!data||!isValid){
    document.getElementById('std-preview-area').classList.remove('on');
    return;
  }
  
  let fg=document.getElementById('std-fg').value, bg=document.getElementById('std-bg').value;
  if(document.getElementById('std-invert').checked)[fg,bg]=[bg,fg];
  
  const res=+document.getElementById('std-res').value, ecc=document.getElementById('std-ecc').value;
  const outline=document.getElementById('std-outline').checked;
  
  const qr=qrcode(0, ecc);
  try{qr.addData(data);qr.make()}catch{
    document.getElementById('std-preview-area').classList.remove('on');
    return;
  }
  
  const N=qr.getModuleCount(), canvas=document.getElementById('std-canvas');
  const quiet=3; // 白边模块数
  const totalMod=N+quiet*2;
  const scale=Math.max(2, Math.floor(res/totalMod));
  const realSize=totalMod*scale;
  
  canvas.width=realSize; canvas.height=realSize;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=bg;
  ctx.fillRect(0, 0, realSize, realSize);
  
  const offset=quiet*scale;
  
  // 1. 绘制普通数据码点（避开三个 7x7 角眼）
  ctx.fillStyle=fg;
  for(let r=0; r<N; r++){
    for(let c=0; c<N; c++){
      if(isFinderPattern(r, c, N)) continue;
      if(!qr.isDark(r, c)) continue;
      
      const x=offset+c*scale, y=offset+r*scale;
      const cx=x+scale/2, cy=y+scale/2;
      
      if(currentDotStyle==='square'){
        ctx.fillRect(x, y, scale, scale);
      } else if(currentDotStyle==='dots'){
        // 独立正圆点 (图2)
        ctx.beginPath();
        ctx.arc(cx, cy, scale*0.42, 0, Math.PI*2);
        ctx.fill();
      } else if(currentDotStyle==='capsule'){
        // 胶囊条块 (图1)
        const top=r>0&&qr.isDark(r-1,c)&&!isFinderPattern(r-1,c,N);
        const btm=r<N-1&&qr.isDark(r+1,c)&&!isFinderPattern(r+1,c,N);
        const left=c>0&&qr.isDark(r,c-1)&&!isFinderPattern(r,c-1,N);
        const right=c<N-1&&qr.isDark(r,c+1)&&!isFinderPattern(r,c+1,N);
        
        const rad=scale*0.42;
        ctx.beginPath();
        ctx.roundRect(
          x, y, scale, scale,
          [
            (!top && !left) ? rad : 0,
            (!top && !right) ? rad : 0,
            (!btm && !right) ? rad : 0,
            (!btm && !left) ? rad : 0
          ]
        );
        ctx.fill();
      } else if(currentDotStyle==='fluid'){
        // 流体连通 (图3)
        const rad=scale*0.48;
        ctx.beginPath();
        ctx.arc(cx, cy, scale*0.46, 0, Math.PI*2);
        ctx.fill();
        // 与右边相连
        if(c<N-1 && qr.isDark(r,c+1) && !isFinderPattern(r,c+1,N)){
          ctx.fillRect(cx, cy - scale*0.35, scale, scale*0.7);
        }
        // 与下边相连
        if(r<N-1 && qr.isDark(r+1,c) && !isFinderPattern(r+1,c,N)){
          ctx.fillRect(cx - scale*0.35, cy, scale*0.7, scale);
        }
      }
    }
  }
  
  // 2. 绘制三个定位角眼 (Finder Eyes)
  const eyePositions=[
    [0, 0],          // 左上
    [0, N-7],        // 右上
    [N-7, 0]         // 左下
  ];
  
  eyePositions.forEach(([er, ec])=>{
    drawFinderEye(ctx, offset + ec*scale, offset + er*scale, scale, fg, bg, currentEyeStyle);
  });
  
  // 3. 边框
  if(outline){
    const gap=Math.max(4, Math.round(realSize*0.015));
    ctx.strokeStyle=fg;
    ctx.lineWidth=Math.max(2, Math.round(realSize*0.01));
    ctx.strokeRect(gap, gap, realSize-gap*2, realSize-gap*2);
  }
  
  // 4. Logo
  if(stdLogoImg){
    const logoSize=(N*scale)*0.22;
    const lx=offset+(N*scale-logoSize)/2;
    const ly=offset+(N*scale-logoSize)/2;
    const pad=logoSize*0.1;
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.roundRect(lx-pad, ly-pad, logoSize+pad*2, logoSize+pad*2, 10);
    ctx.fill();
    ctx.drawImage(stdLogoImg, lx, ly, logoSize, logoSize);
  }
  
  document.getElementById('std-preview-area').classList.add('on');
  window._stdCanvas=canvas;
}

// 绘制角眼
function drawFinderEye(ctx, x, y, scale, fg, bg, style){
  const total=7*scale;
  const cx=x+total/2, cy=y+total/2;
  
  ctx.fillStyle=fg;
  
  if(style==='square'){
    // 经典方眼
    ctx.fillRect(x, y, total, total);
    ctx.fillStyle=bg;
    ctx.fillRect(x+scale, y+scale, 5*scale, 5*scale);
    ctx.fillStyle=fg;
    ctx.fillRect(x+2*scale, y+2*scale, 3*scale, 3*scale);
  } else if(style==='rounded'){
    // 圆角方眼 (图1风格)
    ctx.beginPath();
    ctx.roundRect(x, y, total, total, scale*1.8);
    ctx.fill();
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.roundRect(x+scale, y+scale, 5*scale, 5*scale, scale*1.2);
    ctx.fill();
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.roundRect(x+2*scale, y+2*scale, 3*scale, 3*scale, scale*0.8);
    ctx.fill();
  } else if(style==='diamond'){
    // 外圆环 + 内菱形 (图2风格)
    // 外环
    ctx.beginPath();
    ctx.arc(cx, cy, total*0.48, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.arc(cx, cy, total*0.48 - scale, 0, Math.PI*2);
    ctx.fill();
    // 内菱形
    ctx.fillStyle=fg;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI/4);
    const dSize=scale*2.2;
    ctx.fillRect(-dSize/2, -dSize/2, dSize, dSize);
    ctx.restore();
  } else if(style==='circle-dot'){
    // 圆角外框 + 正圆核心 (图3风格)
    ctx.beginPath();
    ctx.roundRect(x, y, total, total, scale*2.0);
    ctx.fill();
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.roundRect(x+scale, y+scale, 5*scale, 5*scale, scale*1.4);
    ctx.fill();
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.arc(cx, cy, scale*1.6, 0, Math.PI*2);
    ctx.fill();
  }
}

}

// 下载与分享
function dlStdPNG(){
  if(!window._stdCanvas)return;
  const a=document.createElement('a');
  a.download='qrcode-'+Date.now()+'.png';
  a.href=window._stdCanvas.toDataURL('image/png');
  a.click();
}
async function shareStd(){
  if(!window._stdCanvas)return;
  try{
    const blob=await new Promise(r=>window._stdCanvas.toBlob(r,'image/png'));
    const file=new File([blob],'qrcode.png',{type:'image/png'});
    if(navigator.canShare?.({files:[file]})){
      await navigator.share({files:[file],title:'二维码'});
      return;
    }
  }catch{}
  dlStdPNG();
}
